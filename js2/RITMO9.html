<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritmo — Caja de ritmos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div id="drum-machine">
 
    <div class="console__top">
      <div class="console__brand">
        <span class="console__power" aria-hidden="true"></span>
        <h1>RITMO<span>-9</span></h1>
      </div>
      <div class="console__screen">
        <p id="display">Listo</p>
      </div>
    </div>
 
    <div id="pad-bank">
 
      <button type="button" class="drum-pad" id="pad-Q" data-name="Heater 1">
        Q
        <audio class="clip" id="Q" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3"></audio>
      </button>
 
      <button type="button" class="drum-pad" id="pad-W" data-name="Heater 2">
        W
        <audio class="clip" id="W" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3"></audio>
      </button>
 
      <button type="button" class="drum-pad" id="pad-E" data-name="Heater 3">
        E
        <audio class="clip" id="E" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3"></audio>
      </button>
 
      <button type="button" class="drum-pad" id="pad-A" data-name="Heater 4">
        A
        <audio class="clip" id="A" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3"></audio>
      </button>
 
      <button type="button" class="drum-pad" id="pad-S" data-name="Aplauso">
        S
        <audio class="clip" id="S" src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3"></audio>
      </button>
 
      <button type="button" class="drum-pad" id="pad-D" data-name="Hi-Hat Abierto">
        D
        <audio class="clip" id="D" src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3"></audio>
      </button>
 
      <button type="button" class="drum-pad" id="pad-Z" data-name="Kick n' Hat">
        Z
        <audio class="clip" id="Z" src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3"></audio>
      </button>
 
      <button type="button" class="drum-pad" id="pad-X" data-name="Patada">
        X
        <audio class="clip" id="X" src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3"></audio>
      </button>
 
      <button type="button" class="drum-pad" id="pad-C" data-name="Hi-Hat Cerrado">
        C
        <audio class="clip" id="C" src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3"></audio>
      </button>
 
    </div>
 
  </div>
 
  <script src="script.js"></script>
</body>
</html>
